# ARCHITECTURE DECISION: NGINX Ingress runs with a static load balancer IP that
# maps to the Azure Application Gateway WAF backend pool. TLS termination happens
# at the ingress controller, allowing WAF to inspect decrypted traffic.
# SECURITY SAFEGUARD: HSTS, SSL redirects, and strict TLS settings are enforced
# at the ingress controller level.

controller:
  service:
    loadBalancerIP: ${load_balancer_ip}
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
      service.beta.kubernetes.io/azure-load-balancer-internal: "false"

  ingressClassResource:
    default: true

  config:
    ssl-redirect: "true"
    force-ssl-redirect: "true"
    use-forwarded-headers: "true"
    proxy-real-ip-cidr: "0.0.0.0/0"
    hsts: "true"
    hsts-include-subdomains: "true"
    hsts-preload: "true"
    hsts-max-age: "31536000"
    enable-modsecurity: "true"
    enable-owasp-core-rules: "true"
    large-client-header-buffers: "4 16k"
    proxy-body-size: "100m"
    log-format-escape-json: "true"
    log-format-upstream: '{"time": "$time_iso8601", "remote_addr": "$remote_addr", "x-forward-for": "$http_x_forwarded_for", "request_id": "$req_id", "remote_user": "$remote_user", "bytes_sent": $bytes_sent, "request_time": $request_time, "status": $status, "vhost": "$host", "request_proto": "$server_protocol", "path": "$uri", "request_query": "$args", "request_length": $request_length, "duration": $request_time, "method": "$request_method", "http_referrer": "$http_referer", "http_user_agent": "$http_user_agent", "upstream_addr": "$upstream_addr", "upstream_response_length": $upstream_response_length, "upstream_response_time": $upstream_response_time, "upstream_status": $upstream_status}'

  metrics:
    enabled: ${enable_telemetry}
    serviceMonitor:
      enabled: ${enable_telemetry}
      namespace: ingress-nginx

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

defaultBackend:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 20Mi
